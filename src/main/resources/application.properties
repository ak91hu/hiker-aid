spring.application.name=HikerAid
server.port=${PORT:8080}
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

spring.thymeleaf.cache=true

# Compress static assets
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml,image/svg+xml
server.compression.min-response-size=1024

# Database: PostgreSQL via DATABASE_URL, H2 fallback for local development
# DatabaseConfig.java handles URL conversion and driver selection
spring.jpa.hibernate.ddl-auto=update

# Google OAuth2 — set via environment variables
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

# Admin — set ADMIN_EMAIL env var to a Google email address to grant admin access
hikerAid.admin-email=${ADMIN_EMAIL:}

# Gemini AI — set GEMINI_API_KEY env var for AI performance analysis
hikerAid.gemini-api-key=${GEMINI_API_KEY:}

# Resend.com — transactional email via HTTP API (friend invites + emergency alerts)
hikerAid.resend-api-key=${RESEND_API_KEY:}
hikerAid.resend-from=${RESEND_FROM:HikerAid <noreply@myappmail.online>}

# Enable HTTP browser cache for static assets (optimized for low server resource usage and fast loading)
spring.web.resources.cache.cachecontrol.max-age=7d
spring.web.resources.cache.cachecontrol.must-revalidate=true
