name: CI/CD

run-name: CI/CD · ${{ github.event_name }} · ${{ github.ref_name }} · ${{ github.sha }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  java-quality:
    name: Java · unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Build and run unit tests
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Upload Maven test reports
        if: ${{ !cancelled() && (success() || failure()) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maven-test-reports
          path: target/surefire-reports/*.xml
          if-no-files-found: ignore
          retention-days: 14

  container:
    name: Container · build and smoke test
    needs: [java-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the production image
        run: docker build --tag hikeraid:${{ github.sha }} .
      - name: Start production image
        run: |
          docker run --detach \
            --name hikeraid-ci \
            --publish 127.0.0.1:8080:8080 \
            --env GOOGLE_CLIENT_ID=ci-placeholder \
            --env GOOGLE_CLIENT_SECRET=ci-placeholder \
            hikeraid:${{ github.sha }}
      - name: Verify application health
        run: |
          curl --fail --silent --show-error \
            --retry 20 --retry-delay 2 --retry-all-errors \
            http://127.0.0.1:8080/api/health | jq --exit-status '.status == "ok"'
      - name: Print container logs on failure
        if: failure()
        run: docker logs hikeraid-ci
      - name: Remove smoke-test container
        if: always()
        run: docker rm --force hikeraid-ci || true

  quality-gate:
    name: Quality gate
    if: always()
    needs: [java-quality, container]
    runs-on: ubuntu-latest
    steps:
      - name: Require every pre-deployment check
        env:
          JAVA_QUALITY: ${{ needs.java-quality.result }}
          CONTAINER: ${{ needs.container.result }}
        run: |
          printf '%s\n' "java-quality=$JAVA_QUALITY" "container=$CONTAINER"
          test "$JAVA_QUALITY" = success
          test "$CONTAINER" = success
